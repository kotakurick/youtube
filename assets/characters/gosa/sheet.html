<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ゴサ 設定表</title>
<style>
body{margin:0;width:1500px;background:#F5F2EA;font-family:'IPAGothic',sans-serif;color:#1D2333}
h1{font-size:34px;margin:22px 30px 0} .lead{font-size:17px;margin:4px 30px 10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 10px;padding:0 24px}
.c{text-align:center;font-size:14px} .c img{width:230px}
.band{background:#1D2333;margin:14px 24px;border-radius:12px;padding:8px 10px;display:flex;justify-content:space-around}
.band img{width:200px}
.row{display:flex;align-items:center;gap:28px;padding:6px 30px 24px;font-size:14px}
.row img{border-radius:50%;box-shadow:0 0 0 1px #d9d3c4}
</style></head><body>
<h1>ゴサ（ゴサの答え合わせ）設定表</h1>
<div class="lead">ひげ＝横向きの誤差棒。短い＝言い切り、長く垂れる＝条件次第。色は墨 #1D2333 と白だけ。原点＝体の中心で、どの表情も同じ枠（差し替えても位置がずれない）。</div>
<div class="grid"><div class="c"><img src="svg/normal.svg"><div>ふつう</div></div><div class="c"><img src="svg/surprised.svg"><div>驚き：ひげが跳ね上がる</div></div><div class="c"><img src="svg/assertive.svg"><div>言い切り：ひげが短い＝確か</div></div><div class="c"><img src="svg/thinking.svg"><div>考え中：ひげが片方ずつ上下</div></div><div class="c"><img src="svg/skeptical.svg"><div>ジト目：疑っている</div></div><div class="c"><img src="svg/depends.svg"><div>条件次第：ひげが長く垂れる＝不確か</div></div><div class="c"><img src="svg/happy.svg"><div>喜び</div></div><div class="c"><img src="svg/down.svg"><div>落胆：ひげも耳も下がる</div></div><div class="c"><img src="svg/panic.svg"><div>焦り：ひげが震える</div></div><div class="c"><img src="svg/idea.svg"><div>ひらめき</div></div><div class="c"><img src="svg/point.svg"><div>指し示し：右のひげを伸ばして指す</div></div></div>
<div class="lead" style="margin-top:12px">暗い背景用（白い縁取り付き。サムネイルの濃い帯の上など）</div>
<div class="band"><img src="svg/normal_dark.svg"><img src="svg/surprised_dark.svg"><img src="svg/assertive_dark.svg"><img src="svg/depends_dark.svg"><img src="svg/happy_dark.svg"><img src="svg/point_dark.svg"></div>
<div class="lead">チャンネルのアイコン（実際の表示の大きさ）</div>
<div class="row"><img src="icon.svg" width="128"> 128px <img src="icon.svg" width="64"> 64px <img src="icon.svg" width="32"> 32px <img src="icon.svg" width="24"> 24px</div>
</body></html>
